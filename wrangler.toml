name = "lms-katlearn"
main = "./cloudflare-worker.js"
compatibility_date = "2026-10-15"
upload_source_maps = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[[services]]
binding = "KATLEARN_API"
service = "katlearn-lms-api"

[observability]
enabled = true
