name: admin backend syntax

on:
  push:
    paths:
      - "api/**"
      - "scripts/**"
      - ".github/workflows/admin-backend-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all API syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in api/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
