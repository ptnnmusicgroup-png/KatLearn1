name: Admin runtime smoke
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check LMS Admin Hub without auth
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 'https://lms-katlearn.vercel.app/api/admin-hub?section=overview' || true)"
            echo "Attempt $i: HTTP $code"
            cat "$body" || true
            if [ "$code" = "401" ] && grep -q 'missing_admin_token' "$body"; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Diagnose Firebase Admin credential env presence
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -H 'Authorization: Bearer diagnostic-invalid-token' 'https://lms-katlearn.vercel.app/api/admin-hub?section=overview' || true)"
          echo "Diagnostic HTTP $code"
          cat "$body" || true
          if [ "$code" != "401" ]; then
            echo "Firebase Admin runtime is not healthy/configured: expected 401 from an invalid token when server credentials are valid."
            exit 1
          fi
          if grep -Eq 'firebase_credentials_(missing|invalid|incomplete)|firebase_project_mismatch' "$body"; then
            echo "Firebase Admin configuration error detected in production."
            exit 1
          fi

      - name: Check Teacher Admin proxy without auth
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 'https://teacher-katlearn.vercel.app/api/admin-hub?section=overview' || true)"
            echo "Attempt $i: HTTP $code"
            cat "$body" || true
            if [ "$code" = "401" ] && grep -q 'missing_admin_token' "$body"; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
