name: Netlify build smoke check

on:
  push:
    branches: [main, codex/ui-motion-refresh, chore/netlify-only-remove-legacy-hosting]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/build-netlify.js netlify/adapter.js netlify/functions/*.js api/*.js meteor-match.js katfly.js app.js test.js learning-goals.js katlearn-motion.js home-account.js dmca-badge.js theme-shop.js site-footer.js katlearn-activation.js; do
            node --check "$file"
          done
      - name: Verify arcade split wiring and startup regressions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const meteor = fs.readFileSync('meteor-match.js', 'utf8');
          const katfly = fs.readFileSync('katfly.js', 'utf8');
          const practice = fs.readFileSync('practice.html', 'utf8');
          const failures = [];
          if (!/function\s+distractors\s*\(/.test(meteor)) failures.push('Meteor Match is missing its distractor selector.');
          const startAt = katfly.indexOf('async function startFlappy()');
          const startBody = startAt >= 0 ? katfly.slice(startAt) : '';
          const runningAt = startBody.indexOf('state.running = true');
          const firstGateAt = startBody.indexOf('startNextFlappyPipe(null)');
          if (startAt < 0 || runningAt < 0 || firstGateAt < 0 || runningAt > firstGateAt) {
            failures.push('KatFly must mark the round running before spawning its first gate.');
          }
          if (!practice.includes('/meteor-match.js?v=20261027-meteor-hotfix2')) failures.push('practice.html does not load the current Meteor Match module.');
          if (!practice.includes('/katfly.js?v=20261027-katfly-hotfix2')) failures.push('practice.html does not load the current KatFly module.');
          if (practice.includes('/arcade-games.js')) failures.push('practice.html still references the retired combined arcade script.');
          if (failures.length) {
            console.error('::error::Arcade regression check failed\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log('Verified split arcade module wiring and both previously identified startup regressions.');
          NODE
      - name: Verify one central UI stylesheet is used
        shell: bash
        run: |
          set -euo pipefail
          test -s katlearn-defaultdarkmode.css
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const skipped = new Set(['.git', 'node_modules', 'dist', '.netlify']);
          const pages = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!skipped.has(entry.name)) walk(path.join(dir, entry.name));
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith('.html') && entry.name.toLowerCase() !== 'dmca-validation.html') {
                pages.push(path.join(dir, entry.name));
              }
            }
          }
          walk(root);
          const issues = [];
          for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            const styleLinks = (html.match(/<link\b[^>]*>/gi) || []).filter(tag => /\brel=["']stylesheet["']/i.test(tag));
            const centralLinks = styleLinks.filter(tag => /\bhref=["'][^"']*katlearn-defaultdarkmode\.css/i.test(tag));
            if (styleLinks.length !== 1 || centralLinks.length !== 1) {
              issues.push(path.relative(root, file) + ': expected exactly one katlearn-defaultdarkmode.css link, found ' + styleLinks.length + ' stylesheet link(s).');
            }
            if (/<style\b[^>]*>[\s\S]*?<\/style>/i.test(html)) {
              issues.push(path.relative(root, file) + ': inline <style> block remains');
            }
          }
          if (issues.length) {
            console.error('::error::Every HTML page must use only katlearn-defaultdarkmode.css');
            console.error(issues.join('\n'));
            process.exit(1);
          }
          console.log('Verified ' + pages.length + ' HTML pages use the single Default Dark Mode stylesheet.');
          NODE
      - name: Build Netlify static output
        env:
          KATLEARN_LMS_SITE_URL: https://lms-katlearn.netlify.app
          KATLEARN_TEACHER_SITE_URL: https://quanly-giaovien-katlearn.netlify.app
          KATLEARN_ALLOWED_ORIGINS: https://lms-katlearn.netlify.app,https://quanly-giaovien-katlearn.netlify.app
        run: node scripts/build-netlify.js
      - name: Verify static publish excludes server files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/katlearn-defaultdarkmode.css
          test -s dist/katlearn-motion.js
          test -s dist/meteor-match.js
          test -s dist/katfly.js
          test -s dist/deployment-config.js
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('dist');
          const pages = fs.readdirSync(root).filter(name => name.toLowerCase().endsWith('.html'));
          const missing = pages.filter(name => name.toLowerCase() !== 'dmca-validation.html' && !fs.readFileSync(path.join(root, name), 'utf8').includes('src="/katlearn-motion.js?v=20261024-1"'));
          if (missing.length) {
            console.error('::error::Motion runtime missing from published pages: ' + missing.join(', '));
            process.exit(1);
          }
          const tokenPage = fs.readFileSync(path.join(root, 'dmca-validation.html'), 'utf8');
          if (tokenPage.includes('katlearn-motion.js')) {
            console.error('::error::Motion runtime must not be injected into the DMCA validation token page.');
            process.exit(1);
          }
          console.log('Verified motion runtime injection across ' + (pages.length - 1) + ' UI pages; DMCA validation remains untouched.');
          NODE
          test ! -e dist/api
          test ! -e dist/netlify
          test ! -e dist/scripts
          test ! -e dist/.env.example
          test ! -e dist/netlify.toml
          test ! -e dist/NETLIFY_MIGRATION.md
      - name: Reject retired hosting references in source
        shell: bash
        run: |
          set -euo pipefail
          # Compose forbidden signatures from fragments so this guard does not
          # leave complete retired-provider names embedded in the repository.
          retired_hosting_pattern="$(printf '%s%s|%s%s|%s[.]%s|%s[.]%s|%s%s' \
            'ver' 'cel' 'cloud' 'flare' 'pages' 'dev' 'workers' 'dev' 'wran' 'gler')"
          legacy_teacher_host="$(printf '%s%s' 'https://teacher-katlearn' '.netlify.app')"
          scan_args=(--exclude-dir=.git --exclude-dir=dist --exclude-dir=node_modules --exclude-dir=.netlify)
          if grep -RInEi "${scan_args[@]}" -E "$retired_hosting_pattern" .; then
            echo "::error::Retired-hosting reference found in source."
            exit 1
          fi
          if grep -RInF "${scan_args[@]}" "$legacy_teacher_host" .; then
            echo "::error::Stale Teacher hostname found in source."
            exit 1
          fi
          if grep -RInF "$legacy_teacher_host" dist; then
            echo "::error::Stale Teacher hostname leaked into the published output."
            exit 1
          fi
