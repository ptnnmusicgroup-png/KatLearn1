[build]
  command = "node scripts/netlify-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."admin-hub"]
  included_files = ["data/national-catalog/**/*", "data/vocabulary/**/*"]

[functions."game-action"]
  included_files = ["data/vocabulary/**/*"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
