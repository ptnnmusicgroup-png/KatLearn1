<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | KatLearn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8f7ff,#fff7f8);font-family:'Be Vietnam Pro',sans-serif;color:#344054;padding:20px}.auth{width:min(430px,100%);background:#fff;border:1px solid #ececf3;border-radius:24px;padding:32px;box-shadow:0 22px 60px #4c42631a}.logo{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#8d7dff,#5d4fea);color:#fff;font:700 28px Fredoka}.auth h1{text-align:center;font:700 28px Fredoka;margin:0 0 7px}.sub{text-align:center;color:#8792a5;font-size:12px;line-height:1.55;margin:0 0 24px}.btn{width:100%;border:1px solid #e3e6ed;background:#fff;border-radius:11px;padding:12px 14px;font:600 12px 'Be Vietnam Pro';cursor:pointer;margin-bottom:10px}.btn:hover{border-color:#aaa0ff;background:#faf9ff}.apple{background:#1d1e24;color:#fff;border-color:#1d1e24}.google b{color:#4285f4;font-size:16px}.divider{display:flex;align-items:center;gap:10px;color:#a5adba;font-size:10px;margin:15px 0}.divider:before,.divider:after{content:'';height:1px;background:#e8ebf0;flex:1}input{width:100%;padding:12px;border:1px solid #e3e6ed;border-radius:10px;background:#fbfcff;outline:0;font:500 12px 'Be Vietnam Pro';margin-bottom:9px}input:focus{border-color:#8d7dff;box-shadow:0 0 0 3px #8d7dff18}.primary{background:#f47c93;color:#fff;border-color:#f47c93}.switch{text-align:center;margin:15px 0 0;font-size:11px;color:#8792a5}.switch a{color:#dc6b80;font-weight:700;text-decoration:none}.status{text-align:center;min-height:18px;color:#d76576;font-size:10px;margin-top:10px}.back{display:block;text-align:center;margin-top:18px;color:#8792a5;text-decoration:none;font-size:10px}
  </style>
</head>
<body>
  <main class="auth">
    <div class="logo">K</div>
    <h1>Chào mừng trở lại!</h1>
    <p class="sub">Đăng nhập để đồng bộ tiến độ học tập, KatCoin và bộ từ vựng.</p>
    <button class="btn google" id="google"><b>G</b> &nbsp; Đăng nhập bằng Google</button>
    <button class="btn apple" id="apple">● &nbsp; Đăng nhập bằng Apple</button>
    <div class="divider">hoặc</div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn primary" id="emailLogin">Đăng nhập bằng Email →</button>
    <p class="switch">Chưa có tài khoản? <a href="signup.html">Đăng ký ngay</a></p>
    <div class="status" id="status"></div>
    <a class="back" href="index.html">← Quay lại KatLearn</a>
  </main>
  <script src="firebase-service.js"></script>
  <script>
    const $=s=>document.querySelector(s), status=$('#status');
    async function init(){try{await window.studyStore.connect(window.KATLEARN_FIREBASE_CONFIG)}catch(e){status.textContent='❌ '+(e?.message||'Không thể kết nối Firebase.')}}
    async function provider(type){try{status.textContent='⏳ Đang đăng nhập...';await window.studyStore.signIn(type);location.href='index.html'}catch(e){status.textContent='❌ '+(e?.message||'Không thể đăng nhập.')}}
    $('#google').onclick=()=>provider('google');$('#apple').onclick=()=>provider('apple');
    $('#emailLogin').onclick=async()=>{const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(!email||!password){status.textContent='❌ Nhập email và mật khẩu nhé.';return}try{status.textContent='⏳ Đang đăng nhập...';await window.studyStore.signInEmail(email,password,false);location.href='index.html'}catch(e){status.textContent='❌ '+(e?.message||'Email hoặc mật khẩu không đúng.')}};
    init();
  </script>
</body>
</html>
